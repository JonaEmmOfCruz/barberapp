name: barber_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  image_picker: ^1.2.1
  apple_maps_flutter: ^1.4.0
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  shared_preferences: ^2.2.2
  url_launcher: ^6.3.0
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0
  lottie: ^3.3.3
  cupertino_icons: ^1.0.8
  device_info_plus: ^10.1.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/icon/app_icon.png